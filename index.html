<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0b0f" />
    <meta name="color-scheme" content="dark light" />
    <title>Brain Drain — Build & Share Expert Decision Brains</title>
    <meta
      name="description"
      content="Brain Drain lets you create interactive decision brains, follow learning pathways, join communities, and track your progress — offline-first and beginner friendly."
    />
    <meta name="robots" content="index, follow" />
    <meta name="application-name" content="Brain Drain" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Brain Drain" />

    <meta property="og:title" content="Brain Drain — Build & Share Expert Decision Brains" />
    <meta
      property="og:description"
      content="Create interactive decision brains, follow learning pathways, and join knowledge communities."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/opengraph.jpg" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Brain Drain" />
    <meta
      name="twitter:description"
      content="Create interactive decision brains, follow learning pathways, and join knowledge communities."
    />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-icon.png" />
    <!-- Web app manifest: the app registers a service worker and ships the
         iOS web-app meta tags, but without this it could not be installed. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Load Inter without blocking first paint. Falls back to system fonts
         until the stylesheet applies. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
